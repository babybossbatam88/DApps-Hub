  </div></div>
`;

/* ------------------------------- Data sources -------------------------- */
SCREENS.sources = () => `
  ${pageHead("Data Sources", "Where every number comes from, and whether that source is currently answering.")}
  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><div class="hd"><h3>Base Mainnet RPC</h3>
      <div class="split">${state.chain.reachable === null ? `<span class="badge ghost">not probed</span>` : state.chain.reachable ? `<span class="badge pos">reachable</span>` : `<span class="badge neg">unreachable</span>`}
      <button class="btn sm ghost" id="probe">recheck</button></div></div><div class="bd">
      <dl class="rows">
        <div><dt>Chain id</dt><dd>${CHAIN.id}</dd></div>
        <div><dt>Endpoint</dt><dd class="mono" style="font-size:11px;overflow-wrap:anywhere">${esc(state.rpcUrl)}</dd></div>
        <div><dt>Latest block</dt><dd>${state.chain.block ? esc(state.chain.block) : `<span class="faintc">N/A</span>`}</dd></div>
        <div><dt>Latency</dt><dd>${state.chain.latencyMs !== null ? state.chain.latencyMs + " ms" : `<span class="faintc">N/A</span>`}</dd></div>
        <div><dt>RPC calls this session</dt><dd>${rpcCallCount}</dd></div>
      </dl>
      ${state.chain.error ? `<div class="note neg" style="margin-top:12px"><b class="mono">${esc(state.chain.error.code)}</b><br />${esc(state.chain.error.message)}</div>` : ""}
    </div></div>

    <div class="card"><div class="hd"><h3>Storage</h3><span class="badge warn">browser only</span></div><div class="bd">
      <p class="mutedc" style="font-size:13px;margin:0 0 10px">This file has no database. What persists lives in this browser's localStorage:</p>
      <dl class="rows">
        <div><dt>Mode, endpoint, address</dt><dd class="pos">stored</dd></div>
        <div><dt>Thresholds</dt><dd class="pos">stored</dd></div>
        <div><dt>Manual entry bases</dt><dd class="pos">stored</dd></div>
        <div><dt>Snapshot history</dt><dd class="faintc">not stored</dd></div>
        <div><dt>Price history</dt><dd class="faintc">not stored</dd></div>
      </dl>
      <p class="faintc" style="font-size:11px;margin:10px 0 0">Clearing site data loses all of it. Nothing is sent anywhere.</p>
    </div></div>
  </div>

  <div class="card" style="margin-bottom:18px"><div class="hd"><h3>Uniswap V3 contracts — Base</h3></div><div class="bd">
    <div class="scroll"><table>
      <thead><tr><th>Contract</th><th>Address</th></tr></thead>
      <tbody>${Object.entries({ ...CHAIN.uniswapV3, multicall3: CHAIN.multicall3 }).map(([k, v]) => `<tr>
        <td class="mutedc">${esc(k)}</td>
        <td><a class="mono" style="font-size:11px" href="${CHAIN.explorer}/address/${esc(v)}" target="_blank" rel="noreferrer noopener">${esc(v)}</a></td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div></div>

  <div class="card"><div class="hd"><h3>Asset registry — Base</h3></div><div class="bd">
    <div class="scroll"><table>
      <thead><tr><th>Symbol</th><th class="hide-sm">Address</th><th class="r">Decimals hint</th><th class="r">Market</th></tr></thead>
      <tbody>${Object.entries(TOKENS).map(([addr, t]) => `<tr>
        <td><b>${esc(t.symbol)}</b></td>
        <td class="mono hide-sm" style="font-size:11px">${esc(addr)}</td>
        <td class="r num faintc">${t.decimals}</td>
        <td class="r">${t.binance ? `<span class="mono" style="font-size:11px">${esc(t.binance)}</span>${t.proxy ? ` <span class="badge warn">proxy</span>` : ""}` : `<span class="faintc">none</span>`}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <p class="mutedc" style="font-size:12px;margin:14px 0 0">These decimals are <b>labelling hints only</b>. Every decimals used in arithmetic is read from the token contract during a scan — a wrong hard-coded value would scale every amount by a power of ten, so the maths never trusts this table.</p>
  </div></div>
`;

/* ---------------------------------- Alerts ----------------------------- */
SCREENS.alerts = () => {
  const list = activePositions();
  const firing = [];
  for (const p of list) {
    const r = rangeEngine(p, state.thresholds);
    if (r.state === "OUT_BELOW" || r.state === "OUT_ABOVE") {
      firing.push({ sev: "neg", title: "Out of range", body: p.pairLabel + " #" + p.id + " is " + RANGE_META[r.state].label.toLowerCase() + " and earning no fees." });
    } else if (r.nearestEdgePct <= state.thresholds.criticalEdgePct) {
      firing.push({ sev: "warn", title: "Very close to an edge", body: p.pairLabel + " #" + p.id + " is " + r.nearestEdgePct.toFixed(1) + "% from its nearest bound." });
    } else if (r.nearestEdgePct <= state.thresholds.nearEdgePct) {
      firing.push({ sev: "warn", title: r.state === "NEAR_LOWER" ? "Near lower bound" : "Near upper bound", body: p.pairLabel + " #" + p.id + " is " + r.nearestEdgePct.toFixed(1) + "% from its nearest bound." });
    }
    const hd = hodlEngine(p);
    if (hd && hd.lpVsHodl < 0n) {
      firing.push({ sev: "warn", title: "Behind HODL", body: p.pairLabel + " #" + p.id + " is " + fmtMoney(hd.lpVsHodl, p.unit, { signed: true }) + " against simply holding." });
    }
  }
  if (state.mode === "live" && state.chain.reachable === false) {
    firing.push({ sev: "neg", title: "Sync failure", body: "The RPC endpoint is not answering: " + state.chain.error.code + "." });
  }

  return `
    ${pageHead("Alerts", "Conditions evaluated against the current read. Delivery and history need the server app.")}
    ${firing.length ? `<div class="grid" style="margin-bottom:18px">${firing.map((a) => `<div class="card" style="border-color:${a.sev === "neg" ? "color-mix(in srgb, var(--neg) 32%, transparent)" : "color-mix(in srgb, var(--warn) 32%, transparent)"}"><div class="bd pt">
      <div class="split" style="justify-content:space-between">
        <div><span class="badge ${a.sev}">${a.sev === "neg" ? "critical" : "warning"}</span> <b style="margin-left:8px">${esc(a.title)}</b></div>
        <span class="faintc" style="font-size:11px">evaluated just now</span>
      </div>
      <p class="mutedc" style="font-size:13px;margin:8px 0 0">${esc(a.body)}</p>
    </div></div>`).join("")}</div>`
    : `<div class="card" style="margin-bottom:18px;border-color:color-mix(in srgb, var(--pos) 30%, transparent)"><div class="bd pt">
        <span class="badge pos">nothing firing</span>
        <p class="mutedc" style="font-size:13px;margin:10px 0 0">No condition is currently met across ${list.length} position${list.length === 1 ? "" : "s"}.</p>
      </div></div>`}

    <div class="card" style="margin-bottom:18px"><div class="hd"><h3>Conditions evaluated here</h3></div><div class="bd">
      <dl class="rows">
        <div><dt>Position near lower / upper bound</dt><dd class="pos">live</dd></div>
        <div><dt>Out of range</dt><dd class="pos">live</dd></div>
        <div><dt>LP vs HODL below threshold</dt><dd class="pos">live</dd></div>
        <div><dt>Sync failure</dt><dd class="pos">live</dd></div>
        <div><dt>Fees reach threshold</dt><dd class="faintc">needs a baseline over time</dd></div>
        <div><dt>Fee APR below threshold</dt><dd class="faintc">needs a snapshot series</dd></div>
        <div><dt>Price movement threshold</dt><dd class="faintc">needs a prior price</dd></div>
      </dl>
    </div></div>

    ${needsServer("Delivery, cooldowns, and history",
      "An alert is only useful if it reaches you when the page is closed. That needs a scheduler evaluating rules on stored snapshots, cooldowns so a price oscillating around a bound does not fire a hundred times, and a delivery record of what was sent.")}
  `;
};

/* --------------------------------- Settings ---------------------------- */
SCREENS.settings = () => `
  ${pageHead("Settings", "Thresholds feed the range, rebalance, and alert engines directly. Stored in this browser.")}
  <div class="grid g2" style="margin-bottom:18px">
    <div class="card"><div class="hd"><h3>Range thresholds</h3></div><div class="bd">
      <div class="grid g2" style="gap:12px">
        <div><label class="fl">Safe distance from edge (%)</label><input class="mono" type="number" id="th-safe" value="${state.thresholds.safeEdgePct}" min="1" max="49" /></div>
        <div><label class="fl">Near-edge warning (%)</label><input class="mono" type="number" id="th-near" value="${state.thresholds.nearEdgePct}" min="1" max="49" /></div>
        <div><label class="fl">Critical edge (%)</label><input class="mono" type="number" id="th-crit" value="${state.thresholds.criticalEdgePct}" min="1" max="49" /></div>
      </div>
      <p class="faintc" style="font-size:11px;margin:12px 0 0">Measured as a share of the remaining distance across the range in tick space, not as a share of the price — ticks are linear in log-price, so this behaves correctly at both edges.</p>
    </div></div>

    <div class="card"><div class="hd"><h3>Rebalance economics</h3></div><div class="bd">
      <div class="grid g2" style="gap:12px">
        <div><label class="fl">Minimum position size</label><input class="mono" type="number" id="th-min" value="${state.thresholds.minPositionSize}" min="0" /></div>
        <div><label class="fl">Estimated cost to rebalance</label><input class="mono" type="number" id="th-cost" value="${state.thresholds.estRebalanceCost}" min="0" step="0.5" /></div>
      </div>
      <p class="faintc" style="font-size:11px;margin:12px 0 0">Below the minimum size, gas dominates any yield improvement and the engine recommends EXIT REVIEW rather than REBALANCE.</p>
    </div></div>
  </div>

  <div class="split" style="margin-bottom:22px"><button class="btn primary" id="save-th">Save thresholds</button><button class="btn ghost" id="reset-th">Reset to defaults</button></div>

  <div class="card"><div class="hd"><h3>What this file is, and is not</h3></div><div class="bd">
    <dl class="rows">
      <div><dt>Position discovery, inventory, range state</dt><dd class="pos">full</dd></div>
      <div><dt>Uncollected fees</dt><dd class="pos">full</dd></div>
      <div><dt>LP vs HODL and divergence</dt><dd class="warnc">needs an entry basis</dd></div>
      <div><dt>Rebalance recommendation</dt><dd class="pos">full</dd></div>
      <div><dt>Simulation lab</dt><dd class="pos">full</dd></div>
      <div><dt>Fee APR, time in range, 30/90/365</dt><dd class="faintc">server app</dd></div>
      <div><dt>Portfolio chart over time</dt><dd class="faintc">server app</dd></div>
      <div><dt>Binance account access</dt><dd class="faintc">server app</dd></div>
      <div><dt>Background sync and alert delivery</dt><dd class="faintc">server app</dd></div>
    </dl>
  </div></div>
`;

function pageHead(title, sub) {
  return `<h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : `<div style="height:14px"></div>`}`;
}

/* =========================================================================
   12. SHELL + RENDER
   ========================================================================= */
CHAIN.shortName = "Base";

function icon(d) {
  return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
}

function shell(body) {
  const groups = [...new Set(NAV.map((n) => n.group))];
  const mobile = NAV.filter((n) => n.mobile);
  return `
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 12.5 6 7l3 3.2L14 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><b>LP Command</b><span>Center</span></span>
      </div>
      <div class="navwrap">
        ${groups.map((g) => `<div class="navgroup"><h6>${esc(g)}</h6>
          ${NAV.filter((n) => n.group === g).map((n) => `<button class="nav ${state.route === n.id ? "on" : ""}" data-go="${n.id}">${icon(n.icon)}<span>${esc(n.label)}</span></button>`).join("")}
        </div>`).join("")}
      </div>
      <div class="sidefoot">Read-only. This file never requests keys and cannot sign transactions.</div>
    </aside>

    <div class="main">
      <header class="top">
        <div class="split">
          <span class="badge ghost hide-sm"><span class="dot" style="background:var(--info)"></span>Base · ${CHAIN.id}</span>
          ${freshness()}
        </div>
        <div class="split">
          <button class="btn sm" id="theme-toggle" aria-label="${currentTheme() === "dark" ? "Switch to light theme" : "Switch to dark theme"}" title="${currentTheme() === "dark" ? "Switch to light theme" : "Switch to dark theme"}" style="width:34px;padding:0">
            ${currentTheme() === "dark"
              ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
              : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`}
          </button>
          <button class="btn sm ${state.mode === "demo" ? "" : "primary"}" id="mode-toggle">${state.mode === "demo" ? "DEMO MODE" : "LIVE MODE"}</button>
        </div>
      </header>
      ${state.mode === "demo" ? `<div style="background:color-mix(in srgb, var(--warn) 10%, transparent);border-bottom:1px solid color-mix(in srgb, var(--warn) 28%, transparent);color:var(--warn);text-align:center;padding:8px 16px;font-size:12px">
        <b>Demo mode.</b> A fixture position, computed by the same engine live mode uses. Switch to LIVE to read a real address.</div>` : ""}
      <div class="content"><div class="inner">${body}</div></div>
    </div>
  </div>

  <nav class="tabbar">
    ${mobile.map((n) => `<button class="tab ${state.route === n.id ? "on" : ""}" data-go="${n.id}">${icon(n.icon)}<span>${esc(n.short || n.label)}</span></button>`).join("")}
    <button class="tab ${!mobile.some((n) => n.id === state.route) ? "on" : ""}" id="more-btn">
      ${icon("M5 12h.01M12 12h.01M19 12h.01")}<span>More</span></button>
  </nav>`;
}

let DEMO_POSITIONS = [];

function render() {
  const screen = SCREENS[state.route] || SCREENS.overview;
  let body;
  try { body = screen(); }
  catch (e) {
    console.error(e);
    body = `<div class="note neg"><b>This view could not be rendered.</b><br />${esc(e.message)}<br /><span class="faintc">No figures are shown rather than partial ones.</span></div>`;
  }
  document.getElementById("root").innerHTML = shell(body);
  wire();
}

function wire() {
  document.querySelectorAll("[data-go]").forEach((el) => {
    el.addEventListener("click", () => { state.route = el.dataset.go; window.scrollTo(0, 0); render(); });
  });
  document.querySelectorAll("[data-detail]").forEach((el) => {
    el.addEventListener("click", () => { state.detailId = el.dataset.detail; state.route = "detail"; window.scrollTo(0, 0); render(); });
  });

  const themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

  const modeBtn = document.getElementById("mode-toggle");
  if (modeBtn) modeBtn.addEventListener("click", () => {
    state.mode = state.mode === "demo" ? "live" : "demo";
    persist();
    if (state.mode === "live" && state.chain.reachable === null) probeChain();
    render();
  });

  const moreBtn = document.getElementById("more-btn");
  if (moreBtn) moreBtn.addEventListener("click", () => { state.route = "sources"; render(); });

  const addr = document.getElementById("addr");
  if (addr) addr.addEventListener("input", () => { state.address = addr.value; state.addressError = null; persist(); });
  const rpcurl = document.getElementById("rpcurl");
  if (rpcurl) rpcurl.addEventListener("input", () => { state.rpcUrl = rpcurl.value.trim(); persist(); });

  const scanBtn = document.getElementById("scanbtn");
  if (scanBtn) scanBtn.addEventListener("click", () => {
    if (state.mode !== "live") { state.mode = "live"; persist(); }
    scan();
  });

  const probeBtn = document.getElementById("probe");
  if (probeBtn) probeBtn.addEventListener("click", probeChain);

  document.querySelectorAll("[data-save-entry]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.saveEntry;
      const p = activePositions().find((x) => x.id === id);
      if (!p) return;
      const parse = (v, dec) => {
        const s = (v || "0").trim();
        if (!/^\d*\.?\d*$/.test(s) || s === "" || s === ".") return 0n;
        const [i, f = ""] = s.split(".");
        return BigInt(i || "0") * pow10(dec) + BigInt((f + "0".repeat(dec)).slice(0, dec) || "0");
      };
      const a0 = parse(document.getElementById("entry0").value, p.token0.decimals);
      const a1 = parse(document.getElementById("entry1").value, p.token1.decimals);
      if (a0 === 0n && a1 === 0n) return;
      p.entry = { amount0: a0, amount1: a1, source: "manual" };
      saveEntryOverride(id, a0, a1);
      render();
    });
  });

  const save = document.getElementById("save-th");
  if (save) save.addEventListener("click", () => {
    const num = (id, fallback) => {
      const v = Number(document.getElementById(id).value);
      return Number.isFinite(v) && v >= 0 ? v : fallback;
    };
    state.thresholds = {
      safeEdgePct: num("th-safe", DEFAULT_THRESHOLDS.safeEdgePct),
      nearEdgePct: num("th-near", DEFAULT_THRESHOLDS.nearEdgePct),
      criticalEdgePct: num("th-crit", DEFAULT_THRESHOLDS.criticalEdgePct),
      minPositionSize: num("th-min", DEFAULT_THRESHOLDS.minPositionSize),
      estRebalanceCost: num("th-cost", DEFAULT_THRESHOLDS.estRebalanceCost)
    };
    persist();
    render();
  });
  const reset = document.getElementById("reset-th");
  if (reset) reset.addEventListener("click", () => { state.thresholds = { ...DEFAULT_THRESHOLDS }; persist(); render(); });

  ["sim-capital", "sim-fee", "sim-range", "sim-move", "sim-volume", "sim-days"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("change", () => {
      state.sim = {
        capital: Number(document.getElementById("sim-capital").value) || 1000,
        feeTier: Number(document.getElementById("sim-fee").value),
        rangePct: Number(document.getElementById("sim-range").value),
        movePct: Number(document.getElementById("sim-move").value),
        volume: Number(document.getElementById("sim-volume").value) || 0,
        days: Number(document.getElementById("sim-days").value)
      };
      render();
    });
  });

  const marks = document.getElementById("fetch-marks");
  if (marks) marks.addEventListener("click", async () => {
    const box = document.getElementById("marks");
    box.innerHTML = `<span class="faintc" style="font-size:12px">fetching…</span>`;
    try {
      const res = await fetch("https://api.binance.com/api/v3/ticker/price?symbols=%5B%22BTCUSDT%22%2C%22ETHUSDT%22%5D");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      box.innerHTML = `<table><thead><tr><th>Market</th><th class="r">Price</th><th class="r">Read</th></tr></thead><tbody>
        ${data.map((d) => `<tr><td class="mono">${esc(d.symbol)}</td><td class="r num">${esc(d.price)}</td>
        <td class="r"><span class="badge pos">just now</span></td></tr>`).join("")}</tbody></table>
        <p class="faintc" style="font-size:11px;margin:10px 0 0">Public endpoint, no credentials. Using these to mark cbBTC or WETH would be a <b>proxy</b> price and is flagged as such wherever it appears.</p>`;
    } catch (e) {
      box.innerHTML = `<div class="note neg"><b>Could not reach Binance.</b> ${esc(e.message)}<br />
      This is usually a network block or a browser CORS restriction. No price is shown rather than a stale or invented one.</div>`;
    }
  });
}

/* =========================================================================
   13. BOOT
   ========================================================================= */
try {
  DEMO_POSITIONS = buildDemoPositions();
} catch (e) {
  console.error("fixture build failed", e);
  DEMO_POSITIONS = [];
}

// Restore a manual entry basis onto demo positions too, if one was recorded.
render();
if (state.mode === "live") probeChain();
</script>
</body>
</html>
